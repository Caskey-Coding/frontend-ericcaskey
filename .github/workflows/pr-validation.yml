name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  nda-scan:
    name: NDA Content Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Scan for disallowed content
        run: just nda-scan

  voice-scan:
    name: Voice Rule Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Enforce voice rules from ericcaskey-com/frontend/001
        run: just voice-scan

  lint:
    name: Lint
    # Kill switch: set org var CI_PAUSED=true to skip. See AGENTS.md.
    if: vars.CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Public asset guard (size + GPS EXIF)
        run: just public-assets
      - name: Rollback safety tests
        run: just rollback-safety
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Deployment safety tests
        run: just deploy-tests
      - run: just lint
      - run: just typecheck

  build:
    name: Build (static export)
    if: vars.CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [nda-scan, voice-scan, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: static-export-pr-${{ github.event.pull_request.number }}
          path: out/
          retention-days: 3

  e2e:
    name: Playwright E2E
    if: vars.CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: static-export-pr-${{ github.event.pull_request.number }}
          path: out/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: just e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

  npm-audit:
    name: npm audit (advisory)
    if: vars.CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: just audit

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [nda-scan, voice-scan, lint, build, e2e, npm-audit]
    if: always()
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const results = {
              nda:   '${{ needs.nda-scan.result }}',
              voice: '${{ needs.voice-scan.result }}',
              lint:  '${{ needs.lint.result }}',
              build: '${{ needs.build.result }}',
              e2e:   '${{ needs.e2e.result }}',
              audit: '${{ needs.npm-audit.result }}',
            };
            const icon = (r) => r === 'success' ? 'Pass' : r === 'skipped' ? 'Skipped' : 'Fail';
            const body = [
              `## CI — PR #${context.issue.number}`,
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| NDA Content Scan | ${icon(results.nda)} |`,
              `| Voice Rule Scan | ${icon(results.voice)} |`,
              `| Lint + Typecheck | ${icon(results.lint)} |`,
              `| Build (static export) | ${icon(results.build)} |`,
              `| Playwright E2E | ${icon(results.e2e)} |`,
              `| npm audit (advisory) | ${icon(results.audit)} |`,
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('CI — PR #')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
