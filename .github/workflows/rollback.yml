name: Rollback Production (ericcaskey.com)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to redeploy (tag, branch, or SHA)'
        required: true
        type: string
      reason:
        description: 'Rollback reason (logged to Discord)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  S3_BUCKET: ericcaskey.com
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build @ ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Keep rollback controls on the dispatched workflow revision. The target
      # being rebuilt must not be able to downgrade its own production gates.
      - name: Checkout rollback controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: rollback-control
      - name: Checkout rollback target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: rollback-target
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'rollback-target/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'rollback-target/package-lock.json'
      - name: Install rollback target dependencies
        run: npm ci
        working-directory: rollback-target
      - name: Assert contact API URL is configured
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_API_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CONTACT_API_URL is not set; refusing rollback rebuild."
            exit 1
          fi
      - name: Build rollback target
        run: npm run build
        working-directory: rollback-target
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
      - name: Verify contact API URL baked into export
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
        run: bash rollback-control/.github/scripts/verify-contact-export.sh rollback-target/out
      - name: Upload verified rollback artifact
        uses: actions/upload-artifact@v7
        with:
          name: rollback-static-export-${{ github.run_id }}
          path: rollback-target/out/
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production
    steps:
      - name: Checkout rollback controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: rollback-control
      - name: Download verified rollback artifact
        uses: actions/download-artifact@v8
        with:
          name: rollback-static-export-${{ github.run_id }}
          path: out/
      # Reverify the exact downloaded directory before AWS credentials exist.
      # The directory checked here is the directory synchronized below.
      - name: Reverify downloaded rollback artifact
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
        run: bash rollback-control/.github/scripts/verify-contact-export.sh out
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync verified export to S3
        run: aws s3 sync out/ s3://${{ env.S3_BUCKET }} --delete
      - name: Invalidate CloudFront and wait
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"

  healthcheck:
    name: Multi-route healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Checkout rollback controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: rollback-control
      - name: Run rollback healthcheck
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
        run: bash rollback-control/.github/scripts/rollback-healthcheck.sh https://ericcaskey.com

  notify:
    name: Notify Discord (ROLLBACK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, healthcheck]
    if: always()
    environment: production
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF: ${{ inputs.ref }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          if [ "${{ needs.healthcheck.result }}" = "success" ]; then
            COLOR=15844367
            STATUS="↩️ ericcaskey.com ROLLBACK to ${REF} succeeded"
          else
            COLOR=15158332
            STATUS="❌ ericcaskey.com ROLLBACK to ${REF} FAILED"
          fi
          curl -s --max-time 15 -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${STATUS}\",\"description\":\"Ref: \`${REF}\` · Reason: ${REASON} · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",\"color\":${COLOR},\"footer\":{\"text\":\"caskeycoding.com CI/CD\"}}]}" || true
